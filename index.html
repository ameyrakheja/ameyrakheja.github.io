<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Knife portfolio and custom inquiries.">
    <meta name="theme-color" content="#f4f5f4">
    <title>Your Name — Knifemaker</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to photo</a>

    <div class="page">
      <header class="site-header">
        <div class="name">
          <h1>Your Name</h1>
          <p>Knifemaker</p>
        </div>
        <a class="contact" href="mailto:hello@example.com?subject=Knife%20inquiry">hello@example.com</a>
      </header>

      <main id="main" tabindex="-1">
        <figure class="knife">
          <img src="assets/sample-knife.webp" width="1536" height="1024" fetchpriority="high" alt="Placeholder photograph of a knife with a wood handle and satin steel blade">
          <figcaption>
            <span class="knife-name">Knife name</span>
            <span class="photo-note">AI-generated placeholder photo</span>
          </figcaption>
        </figure>
      </main>
    </div>
  </body>
</html>
